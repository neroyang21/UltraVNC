name: Build UltraVNC Server (winvnc.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build winvnc.exe (x64 Release)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install zlib via vcpkg
        run: |
          vcpkg install zlib:x64-windows
          vcpkg integrate install

      - name: Build winvnc.exe Project
        run: |
          # Передаем путь к include и lib от vcpkg напрямую в MSBuild
          $vcpkgInclude = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          $vcpkgLib = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib"
          
          $winvncProj = Get-ChildItem -Recurse -Filter "winvnc.vcxproj" | Select-Object -First 1
          
          if ($winvncProj) {
              Write-Host "Building winvnc: $($winvncProj.FullName)"
              msbuild $winvncProj.FullName `
                /p:Configuration=Release `
                /p:Platform=x64 `
                /p:IncludePath="$vcpkgInclude;$(IncludePath)" `
                /p:LibraryPath="$vcpkgLib;$(LibraryPath)" `
                /m
          } else {
              Write-Error "winvnc.vcxproj not found!"
              exit 1
          }

      - name: Upload winvnc.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winvnc-x64-release
          path: |
            **/winvnc.exe
            **/Release/winvnc.exe
          if-no-files-found: error
