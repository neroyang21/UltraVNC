name: Build UltraVNC Server (winvnc.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build winvnc.exe (x64 Release)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Find and Build Solution
        run: |
          # Ищем решение winvnc.sln или UltraVNC.sln
          $sln = Get-ChildItem -Recurse -Filter "*.sln" | Where-Object { $_.Name -match "winvnc|UltraVNC" } | Select-Object -First 1
          
          if (-not $sln) {
              $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
          }
          
          if ($sln) {
              Write-Host "Found solution: $($sln.FullName)"
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
              Write-Error "No .sln file found in repository!"
              exit 1
          }

      - name: Upload winvnc.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winvnc-x64-release
          path: |
            **/winvnc.exe
            **/Release/*.exe
          if-no-files-found: error
