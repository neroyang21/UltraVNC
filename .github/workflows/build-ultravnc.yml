name: Build UltraVNC Server (winvnc.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build winvnc.exe (x64 Release)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build zlib Dependency
        run: |
          # Ищем и собираем проект zlib
          $zlibProj = Get-ChildItem -Recurse -Filter "*zlib*.vcxproj" | Select-Object -First 1
          if ($zlibProj) {
              Write-Host "Building dependency: $($zlibProj.FullName)"
              msbuild $zlibProj.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
              Write-Host "zlib.vcxproj not found, proceeding..."
          }

      - name: Build winvnc.exe Project
        run: |
          # Собираем основной проект сервера
          $winvncProj = Get-ChildItem -Recurse -Filter "winvnc.vcxproj" | Select-Object -First 1
          if ($winvncProj) {
              Write-Host "Building winvnc: $($winvncProj.FullName)"
              msbuild $winvncProj.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
              Write-Error "winvnc.vcxproj not found!"
              exit 1
          }

      - name: Upload winvnc.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winvnc-x64-release
          path: |
            **/winvnc.exe
            **/Release/winvnc.exe
          if-no-files-found: error
