name: Build UltraVNC Server (winvnc.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build winvnc.exe (x64 Release)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build winvnc.exe Project Directly
        run: |
          # Ищем целевой файл проекта winvnc.vcxproj или winvnc.sln
          $proj = Get-ChildItem -Recurse -Filter "winvnc.vcxproj" | Select-Object -First 1
          if (-not $proj) {
              $proj = Get-ChildItem -Recurse -Filter "winvnc.sln" | Select-Object -First 1
          }
          
          if ($proj) {
              Write-Host "Building project: $($proj.FullName)"
              msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /m
          } else {
              Write-Error "winvnc project file not found!"
              exit 1
          }

      - name: Upload winvnc.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winvnc-x64-release
          path: |
            **/winvnc.exe
            **/Release/winvnc.exe
          if-no-files-found: error
