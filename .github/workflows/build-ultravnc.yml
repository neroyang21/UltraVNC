name: Build UltraVNC Server (winvnc.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build winvnc.exe (x64 Release)
    runs-on: windows-2019

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install C++ ATL Library
        run: |
          $Installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (Test-Path $Installer) {
              Start-Process -FilePath $Installer -ArgumentList "modify --installPath `"${env:VSINSTALLDIR}`" --add Microsoft.VisualStudio.Component.VC.ATL --passive --norestart" -Wait
          } else {
              Write-Error "Visual Studio Installer not found!"
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install zlib via vcpkg
        run: |
          vcpkg install zlib:x64-windows
          vcpkg integrate install

      - name: Build winvnc.exe Project
        run: |
          $vcpkgInc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          $vcpkgLib = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib"
          
          $winvncProj = Get-ChildItem -Recurse -Filter "winvnc.vcxproj" | Select-Object -First 1
          
          if ($winvncProj) {
              Write-Host "Building winvnc: $($winvncProj.FullName)"
              msbuild $winvncProj.FullName `
                /p:Configuration=Release `
                /p:Platform=x64 `
                /p:CL_AllAdditionalIncludeDirectories="$vcpkgInc" `
                /p:Link_AllAdditionalLibraryDirectories="$vcpkgLib" `
                /m
          } else {
              Write-Error "winvnc.vcxproj not found!"
              exit 1
          }

      - name: Upload winvnc.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winvnc-x64-release
          path: |
            **/winvnc.exe
            **/Release/winvnc.exe
          if-no-files-found: error
