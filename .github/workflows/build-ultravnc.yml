name: Build UltraVNC Server (winvnc.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build winvnc.exe (x64 Release)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install ATL / MFC components
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $components = @(
            "Microsoft.VisualStudio.Component.VC.ATL",
            "Microsoft.VisualStudio.Component.VC.ATLMFC"
          )
          foreach ($c in $components) {
            Write-Host "Installing $c ..."
            Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" `
              -ArgumentList "modify --installPath `"$vsInstallPath`" --add $c --passive --norestart" `
              -Wait -PassThru | Out-Null
          }

      - name: Setup vcpkg + dependencies
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:PATH = "C:\vcpkg;$env:PATH"

          # Нужные пакеты (static)
          .\vcpkg install zlib:x64-windows-static
          .\vcpkg install zstd:x64-windows-static
          .\vcpkg install libjpeg-turbo:x64-windows-static
          .\vcpkg install liblzma:x64-windows-static
          .\vcpkg install libsodium:x64-windows-static
          .\vcpkg install minizip-ng:x64-windows-static
          .\vcpkg install openssl:x64-windows-static

          .\vcpkg integrate install

      - name: Build winvnc.sln
        run: |
          $env:CL = "/MP"
          
          # Собираем solution (он сам подтянет все зависимости)
          msbuild winvnc\winvnc.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /m `
            /t:Build `
            /p:AdditionalIncludeDirectories="C:\vcpkg\installed\x64-windows-static\include" `
            /p:AdditionalLibraryDirectories="C:\vcpkg\installed\x64-windows-static\lib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winvnc-x64-release
          path: |
            **/winvnc.exe
            winvnc/**/Release/winvnc.exe
            winvnc/**/x64/Release/winvnc.exe
          if-no-files-found: error
